# Example policy for a generic app database.
# Copy to policies.yaml and edit, or generate one from your own schema with:
#   lokra init "postgresql://user:pass@host:5432/dbname"
database:
  host: 127.0.0.1
  port: 5432
  dbname: app

# Require every agent token to declare a purpose-of-use; it is recorded on
# every request and must be one of the agent's listed purposes.
require_purpose: true

agents:
  support-bot:
    description: Answers customer questions. Reads orders and customers, no writes.
    read:
      customers: [id, name, email, created_at]
      orders: "*"
      products: "*"
    purposes: [customer-support]
    max_rows: 200

  ops-bot:
    description: Updates order status. Writes go through human approval.
    read:
      orders: "*"
    write:
      orders: [update]
    purposes: [order-fulfilment]
    max_rows: 200

masking:
  columns:
    email: redact
    phone: last3
  detectors: [email]

approval_ttl_seconds: 3600
