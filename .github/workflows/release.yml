name: Release
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package and registry versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$version" = "$(python -c 'import json; d=json.load(open("server.json")); print(d["version"] if d["version"] == d["packages"][0]["version"] else "")')"

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  image:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lokrahq/lokra
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, target: macos-arm64}
          - {runner: macos-15-intel, target: macos-x86_64}
          - {runner: ubuntu-22.04, target: linux-x86_64}
          - {runner: ubuntu-22.04-arm, target: linux-arm64}
          - {runner: windows-latest, target: windows-x86_64}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install ".[slack]" "pyinstaller==6.22.3"
          python scripts/build_standalone.py

      - name: Check the build starts, serves MCP and parses SQL
        run: python scripts/smoke_standalone.py build/standalone/dist/lokra/lokra

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.target }}
          path: dist/lokra-*
          if-no-files-found: error

  demo:
    needs: standalone
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone-linux-x86_64

      - name: Run the full demo with the standalone build
        env:
          PSYCOPG_IMPL: binary
          NO_COLOR: "1"
        run: |
          tar -xzf lokra-*-linux-x86_64.tar.gz
          ./lokra/lokra demo --dsn "postgresql://postgres:postgres@127.0.0.1:5432/postgres"

  release:
    needs: [publish, standalone, demo]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: standalone-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum lokra-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(git log -1 --format=%B --grep="^release ${GITHUB_REF_NAME#v}:")
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "${notes:-$(git log -1 --format=%B)}"

      - name: Update the Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not a repository secret here, so the Homebrew formula was not updated"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/lokrahq/homebrew-tap.git" tap
          mkdir -p tap/Formula
          python3 scripts/homebrew_formula.py "$version" dist/SHA256SUMS > tap/Formula/lokra.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lokra.rb
          git commit -m "lokra $version"
          git push origin HEAD:main

  homebrew:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install from the tap and check the version
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv 2>/dev/null || /home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install lokrahq/tap/lokra
          lokra --version | grep -F "${GITHUB_REF_NAME#v}"

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish to the MCP registry
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -fsS -o /dev/null "https://registry.modelcontextprotocol.io/v0/servers/io.github.lokrahq%2Flokra/versions/$version"; then
            echo "io.github.lokrahq/lokra $version is already in the registry"
            exit 0
          fi
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5 6; do
            ./mcp-publisher publish && exit 0
            echo "PyPI may not show the new release yet; retrying in 30s"
            sleep 30
          done
          exit 1
