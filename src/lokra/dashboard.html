<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lokra dashboard</title>
<style>
:root{
  --bg:#f5f6f3;--card:#fff;--ink:#121413;--muted:#6b7280;--faint:#9ca3af;--line:#eceee9;--soft:#f6f7f4;
  --grn:#16a34a;--grn-soft:#dcfce7;--amb:#b45309;--amb-soft:#fef3c7;--red:#dc2626;--red-soft:#fee2e2;--blu:#0ea5e9;--blu-soft:#e0f2fe;
  --sh:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.05);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;display:flex}
.rail{width:66px;flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px}
.rail .logo{width:34px;height:34px;display:grid;place-items:center;color:var(--ink);margin-bottom:14px}
.rail .logo svg{width:26px;height:22px}
.rail button{width:40px;height:40px;border:0;background:transparent;border-radius:11px;color:var(--faint);cursor:pointer;display:grid;place-items:center}
.rail button.on{background:var(--ink);color:#fff}.rail button:not(.on):hover{background:var(--soft);color:var(--ink)}
.rail svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail .sp{flex:1}
main{flex:1;min-width:0;overflow-y:auto;padding:26px 34px 60px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
.top h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 3px}
.top .sub{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--muted);box-shadow:var(--sh)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--grn)}.dot.bad{background:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--sh)}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:14px}
.kpi .ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.g{background:var(--grn-soft);color:var(--grn)}.ic.b{background:var(--blu-soft);color:var(--blu)}.ic.a{background:var(--amb-soft);color:var(--amb)}.ic.n{background:var(--soft);color:var(--muted)}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi .val{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.kpi .val.amb{color:var(--amb)}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--sh)}
.panel h2{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0}
.panel .ph{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.panel .ph small{font:12px var(--mono);color:var(--faint)}
.bignum{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1;margin:2px 0 18px}
.bars{display:flex;align-items:flex-end;gap:18px;height:180px;padding-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%}
.bars .bar{width:100%;max-width:64px;border-radius:8px 8px 0 0;background:#dfe3dc;transition:height .4s}
.bars .bar.hi{background:var(--red)}.bars .bar.g{background:var(--grn)}.bars .bar.a{background:var(--amb)}
.bars .cap{font-size:12px;color:var(--muted);text-align:center}.bars .cap b{display:block;color:var(--ink);font-size:14px;font-weight:600}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{position:relative;width:150px;height:150px;flex:none}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .ctr b{font-size:26px;font-weight:600;letter-spacing:-.02em}.donut .ctr span{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.legend{display:grid;gap:9px;min-width:0}
.legend .li{display:flex;align-items:center;gap:9px;font-size:13px}
.legend .sw{width:9px;height:9px;border-radius:3px;flex:none}.legend .nm{color:var(--muted)}.legend .ct{margin-left:auto;font-variant-numeric:tabular-nums}
.flags{display:grid;gap:9px}
.flag{display:flex;gap:11px;align-items:baseline;padding:13px 15px;border:1px solid var(--line);border-left:3px solid var(--amb);border-radius:10px;background:#fffdf7}
.flag .who{font-weight:600;white-space:nowrap}.flag .ms{color:#92400e}
.allclear{display:flex;align-items:center;gap:10px;color:var(--muted);padding:6px 2px}.allclear .c{width:22px;height:22px;border-radius:50%;background:var(--grn-soft);color:var(--grn);display:grid;place-items:center;font-size:13px}
.reasons{display:grid;gap:12px}
.reason{display:grid;gap:5px}.reason .rr{display:flex;justify-content:space-between;gap:10px;font-size:13px}.reason .rt{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reason .track{height:6px;border-radius:999px;background:var(--soft)}.reason .fill{height:100%;border-radius:999px;background:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:600 11px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
td.t{font:12px var(--mono);color:var(--faint);white-space:nowrap}td.d{color:var(--muted)}
.ev{display:inline-flex;align-items:center;gap:7px;font-size:12.5px}
.ev::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ev.read{color:#64748b}.ev.ok{color:var(--grn)}.ev.wait{color:var(--amb)}.ev.err{color:var(--red)}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.grid,.grid2{grid-template-columns:1fr}.rail{display:none}main{padding:20px}td.hide{display:none}}
</style>
</head>
<body>
<nav class="rail">
  <span class="logo"><svg viewBox="21.5 26 57 48"><path d="M33 54.5V46.5a17 17 0 0 1 34 0V54.5" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><path d="M25 70.5H75" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg></span>
  <button class="on" title="Overview"><svg viewBox="0 0 24 24"><path d="M4 13h7V4H4zM13 20h7v-9h-7zM4 20h7v-5H4zM13 8h7V4h-7z"/></svg></button>
  <button title="Agents"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M4 19c.7-3 2.7-4.5 5-4.5s4.3 1.5 5 4.5"/><path d="M16 6.5a3 3 0 0 1 0 5"/></svg></button>
  <button title="Activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg></button>
  <button title="Policy"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></button>
  <span class="sp"></span>
  <button title="Ledger"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12.5l1.8 1.8L15.6 10"/></svg></button>
</nav>
<main>
  <div class="top">
    <div><h1>Overview</h1><div class="sub" data-sub>Loading your ledger…</div></div>
    <span class="pill" data-status><span class="dot"></span><span data-status-text>…</span></span>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="ic b"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M4 19c.7-3 2.7-4.5 5-4.5s4.3 1.5 5 4.5"/><path d="M16 6.5a3 3 0 0 1 0 5"/></svg></div><div class="lbl">Agents</div><div class="val" data-kpi="agents">–</div></div>
    <div class="kpi"><div class="ic n"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></div><div class="lbl">Statements</div><div class="val" data-kpi="entries">–</div></div>
    <div class="kpi"><div class="ic g"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></div><div class="lbl">Identifiers masked</div><div class="val" data-kpi="masked">–</div></div>
    <div class="kpi"><div class="ic a"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3zM12 10v4M12 17h.01"/></svg></div><div class="lbl">Risk flags</div><div class="val amb" data-kpi="flags">–</div></div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="ph"><h2>Statement outcomes</h2><small data-window></small></div>
      <div class="bignum" data-total>–</div>
      <div class="bars" data-bars></div>
    </div>
    <div class="panel">
      <div class="ph"><h2>What was masked</h2></div>
      <div class="donut-wrap">
        <div class="donut"><svg viewBox="0 0 36 36" width="150" height="150" data-donut></svg><div class="ctr"><b data-donut-total>0</b><span>masked</span></div></div>
        <div class="legend" data-legend></div>
      </div>
    </div>
  </div>

  <div class="grid2">
    <div class="panel">
      <div class="ph"><h2>Risk flags</h2></div>
      <div class="flags" data-flags></div>
    </div>
    <div class="panel">
      <div class="ph"><h2>Top blocked reasons</h2></div>
      <div class="reasons" data-reasons></div>
    </div>
  </div>

  <div class="panel">
    <div class="ph"><h2>Recent activity</h2><small>live · every 4s</small></div>
    <table><thead><tr><th>Time</th><th>Agent</th><th>Event</th><th class="hide">Detail</th></tr></thead><tbody data-recent></tbody></table>
  </div>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const COLORS=["#16a34a","#0ea5e9","#f59e0b","#8b5cf6","#ef4444","#14b8a6","#64748b","#e11d48"];
const sev=ev=>({read:"read",listed_tables:"read",write_executed:"ok",write_approved:"ok",write_proposed:"wait",rejected:"err",db_refused:"err",write_denied:"err",denied:"err"}[ev]||"read");

function bars(ev){
  const g={Reads:ev.read||0,Blocked:(ev.rejected||0)+(ev.db_refused||0)+(ev.denied||0),Writes:ev.write_executed||0,Proposed:ev.write_proposed||0};
  const max=Math.max(1,...Object.values(g));
  $("[data-bars]").innerHTML=Object.entries(g).map(([k,v])=>{
    const cls=k==="Blocked"?"hi":k==="Writes"?"g":k==="Proposed"?"a":"";
    const h=Math.max(v?6:2,Math.round(v/max*150));
    return `<div class="col"><div class="bar ${cls}" style="height:${h}px"></div><div class="cap"><b>${v}</b>${k}</div></div>`;
  }).join("");
}
function donut(byType){
  const items=Object.entries(byType).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const total=items.reduce((a,[,v])=>a+v,0);
  const C=2*Math.PI*15.9155;let off=0;
  const svg=items.map(([k,v],i)=>{const frac=total?v/total:0;const dash=(frac*C).toFixed(2);const el=`<circle cx="18" cy="18" r="15.9155" fill="none" stroke="${COLORS[i%COLORS.length]}" stroke-width="4" stroke-dasharray="${dash} ${(C-dash).toFixed(2)}" stroke-dashoffset="${(-off*C).toFixed(2)}" transform="rotate(-90 18 18)"/>`;off+=frac;return el;}).join("");
  $("[data-donut]").innerHTML=`<circle cx="18" cy="18" r="15.9155" fill="none" stroke="#eef0ec" stroke-width="4"/>`+svg;
  $("[data-donut-total]").textContent=total;
  $("[data-legend]").innerHTML=items.map(([k,v],i)=>`<div class="li"><span class="sw" style="background:${COLORS[i%COLORS.length]}"></span><span class="nm">${esc(k)}</span><span class="ct">${v}</span></div>`).join("")||'<div class="nm" style="color:var(--faint)">nothing masked yet</div>';
}
async function load(){
  let d;try{d=await (await fetch("/api/report",{cache:"no-store"})).json();}catch(e){$("[data-status-text]").textContent="offline";return;}
  const r=d.report, ev=r.events_by_type||{};
  $("[data-status]").querySelector(".dot").className="dot"+(r.chain_verified?"":" bad");
  $("[data-status-text]").textContent=(r.chain_verified?"Chain verified":"CHAIN BROKEN");
  $("[data-sub]").textContent=r.risk_flags?`${r.risk_flags} flag${r.risk_flags>1?"s":""} need your review.`:"No risk flags. Everything looks normal.";
  const masked=r.agents.reduce((a,x)=>a+x.masked_total,0);
  $('[data-kpi="agents"]').textContent=r.agents.length;
  $('[data-kpi="entries"]').textContent=r.entry_count;
  $('[data-kpi="masked"]').textContent=masked;
  $('[data-kpi="flags"]').textContent=r.risk_flags;
  const total=Object.values(ev).reduce((a,b)=>a+b,0);
  $("[data-total]").textContent=total+" total";
  $("[data-window]").textContent=r.entry_count+" entries";
  bars(ev);
  const byType={};r.agents.forEach(a=>Object.entries(a.masked).forEach(([k,v])=>{const n=k.split(":").pop();byType[n]=(byType[n]||0)+v;}));
  donut(byType);
  const flags=[];if(r.identity_denials)flags.push(`<div class="flag"><span class="who">unknown agent</span><span class="ms">${r.identity_denials} access attempt(s) by an unknown or expired agent</span></div>`);
  r.agents.forEach(a=>a.flags.forEach(f=>flags.push(`<div class="flag"><span class="who">${esc(a.agent)}</span><span class="ms">${esc(f.detail)}</span></div>`)));
  $("[data-flags]").innerHTML=flags.length?flags.join(""):'<div class="allclear"><span class="c">✓</span>No risk flags. Nothing unusual in the ledger.</div>';
  const rs=d.report.blocked_reasons||[];const rmax=Math.max(1,...rs.map(x=>x.count));
  $("[data-reasons]").innerHTML=rs.length?rs.map(x=>`<div class="reason"><div class="rr"><span class="rt">${esc(x.reason)}</span><b>${x.count}</b></div><div class="track"><div class="fill" style="width:${Math.round(x.count/rmax*100)}%"></div></div></div>`).join(""):'<div class="nm" style="color:var(--faint)">nothing blocked</div>';
  $("[data-recent]").innerHTML=d.recent.map(e=>`<tr><td class="t">${esc(e.ts)}</td><td>${esc(e.agent)}</td><td><span class="ev ${sev(e.event)}">${esc(e.event)}</span></td><td class="d hide">${esc(e.detail)}</td></tr>`).join("");
}
load();setInterval(load,4000);
</script>
</body>
</html>
